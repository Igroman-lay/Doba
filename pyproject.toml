[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doba"
version = "0.1.1"
description = "Asynchronous library for retrieving Moscow time in the background"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Igroman" }
]
keywords = [
    "time",
    "moscow",
    "async",
    "clock"
]
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "aiodns"
]

[tool.setuptools]
packages = ["Doba"]